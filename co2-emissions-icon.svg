<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="riseArrowGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f8b3ab"/>
      <stop offset="1" stop-color="#ee5f52"/>
    </linearGradient>
    <linearGradient id="cloudGradRise" x1="55" y1="45" x2="150" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7bd06a"/>
      <stop offset="1" stop-color="#2f9e4f"/>
    </linearGradient>
    <linearGradient id="leafGradRise" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0e9c4f"/>
      <stop offset="1" stop-color="#8fdb5e"/>
    </linearGradient>
    <filter id="softHalo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="cloudShadowRise" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1c5c2c" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- soft pale halo behind everything -->
  <ellipse cx="100" cy="95" rx="88" ry="62" fill="#eaf7ec" opacity="0.9" filter="url(#softHalo)"/>

  <!-- rising arrows -->
  <g fill="url(#riseArrowGrad)">
    <rect x="65" y="42" width="12" height="34" rx="2"/>
    <polygon points="71,16 84,38 58,38"/>

    <rect x="94" y="20" width="13" height="56" rx="2"/>
    <polygon points="100.5,2 115,26 86,26"/>

    <rect x="124" y="34" width="12" height="42" rx="2"/>
    <polygon points="130,12 143,32 117,32"/>
  </g>

  <!-- decorative swoosh, upper right -->
  <path d="M 158,34 A 20,20 0 0 1 176,52" fill="none" stroke="#7ccf7a" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- leaves, lower left -->
  <g transform="translate(24,120) rotate(-25) scale(0.8)">
    <path d="M0,0 C-14,-10 -12,-38 0,-50 C12,-38 14,-10 0,0 Z" fill="url(#leafGradRise)"/>
    <path d="M0,-3 L0,-46" stroke="#0c7a44" stroke-width="1.2" opacity="0.6"/>
  </g>
  <g transform="translate(40,124) rotate(8) scale(0.65)">
    <path d="M0,0 C-14,-10 -12,-38 0,-50 C12,-38 14,-10 0,0 Z" fill="url(#leafGradRise)"/>
    <path d="M0,-3 L0,-46" stroke="#0c7a44" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- cloud body -->
  <g filter="url(#cloudShadowRise)">
    <path d="M 62,124
             C 42,124 38,100 56,94
             C 52,74 76,64 90,74
             C 94,52 128,48 136,70
             C 156,62 172,78 162,96
             C 178,100 176,124 156,124
             Z"
          fill="url(#cloudGradRise)" style="paint-order: stroke; stroke:#ffffff; stroke-width:3; stroke-linejoin:round;"/>
  </g>

  <!-- CO2 label -->
  <text x="98" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">CO<tspan font-size="16" dy="7" dx="-3">2</tspan></text>
</svg>
