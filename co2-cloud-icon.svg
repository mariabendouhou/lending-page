<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="55" y1="45" x2="160" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7bd06a"/>
      <stop offset="1" stop-color="#2f9e4f"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0e9c4f"/>
      <stop offset="1" stop-color="#8fdb5e"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1c5c2c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- leaves, behind the cloud -->
  <g transform="translate(44,96) rotate(-25) scale(0.9)">
    <path d="M0,0 C-14,-10 -12,-38 0,-50 C12,-38 14,-10 0,0 Z" fill="url(#leafGrad2)"/>
    <path d="M0,-3 L0,-46" stroke="#0c7a44" stroke-width="1.2" opacity="0.6"/>
  </g>
  <g transform="translate(160,96) rotate(25) scale(0.9)">
    <path d="M0,0 C-14,-10 -12,-38 0,-50 C12,-38 14,-10 0,0 Z" fill="url(#leafGrad2)"/>
    <path d="M0,-3 L0,-46" stroke="#0c7a44" stroke-width="1.2" opacity="0.6"/>
  </g>
  <g transform="translate(170,80) rotate(15) scale(0.65)">
    <path d="M0,0 C-14,-10 -12,-38 0,-50 C12,-38 14,-10 0,0 Z" fill="url(#leafGrad2)"/>
    <path d="M0,-3 L0,-46" stroke="#0c7a44" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- decorative swoosh -->
  <path d="M 28,52 C 40,44 46,56 40,64" fill="none" stroke="#5fbf5a" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- cloud body -->
  <g filter="url(#softShadow)">
    <path d="M 58,108
             C 38,108 34,84 52,78
             C 48,58 72,48 86,58
             C 90,36 124,32 132,54
             C 152,46 168,62 158,80
             C 174,84 172,108 152,108
             Z"
          fill="url(#cloudGrad)" style="paint-order: stroke; stroke:#ffffff; stroke-width:3; stroke-linejoin:round;"/>
  </g>

  <!-- CO2 label -->
  <text x="94" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff">CO<tspan font-size="18" dy="8" dx="-4">2</tspan></text>
</svg>
